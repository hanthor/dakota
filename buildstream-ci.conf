# BuildStream config for the multi-runner CI path (mounted at /src inside the
# bst2 container). Ported from tuna-os/xfce-linux. The generate-bst-ci-config
# action used by build.yml/build-aarch64.yml writes its own config over this
# file at runtime in those workflows; this checked-in copy is used only by
# build-multirunner-aarch64.yml, which shares CAS between runners via
# GHCR-hosted tarballs instead of the projectbluefin CASD service (no mTLS
# secrets needed — works in forks).
scheduler:
  on-error: continue
  fetchers: 12
  builders: 1
  network-retries: 3
logging:
  message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
  error-lines: 80
build:
  max-jobs: 0
  retry-failed: True
cache:
  cache-buildtrees: never
