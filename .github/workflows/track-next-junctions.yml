name: Track next branch junctions

# Runs at 20:00 UTC daily — offset from the main tracker (06:00 UTC) to avoid
# saturating runners when stable-branch builds are active. gnome-build-meta
# master nightly finishes ~08:00 UTC, so 20:00 UTC ensures new artifacts are
# in the CAS before we open a junction-bump PR.
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d

jobs:
  # ── Track core junctions for gnome-51 (next / btw stream) ─────────────────
  # Bumps gnome-build-meta.bst (master) and freedesktop-sdk.bst atomically on
  # the gnome-51 branch. Opens a PR against gnome-51 — no auto-merge, junction
  # bumps require human review.
  #
  # When gnome-build-meta cuts a gnome-51 branch upstream (~Sep 2026), change
  # track: master → track: gnome-51 in elements/gnome-build-meta.bst.
  track-core-junctions-gnome-51:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get mergeraptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      - name: Checkout gnome-51 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: gnome-51
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Just
        uses: taiki-e/install-action@25435dc8dd3baed7417e0c96d3fe89013a5b2e09 # v2
        with:
          tool: just

      - name: Pull BuildStream container image
        run: podman pull "$BST2_IMAGE"

      - name: Track core junctions (gnome-build-meta master + freedesktop-sdk)
        run: |
          just bst --no-interactive source track gnome-build-meta.bst
          just bst --no-interactive source track freedesktop-sdk.bst

      - name: Create or update PR against gnome-51 (auto-merge)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet && { echo "No junction updates"; exit 0; }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/track-gnome51-junction origin/gnome-51
          git add elements/gnome-build-meta.bst elements/freedesktop-sdk.bst
          git commit -m "chore(deps): update core junctions (gnome-51 branch)"
          git push --force-with-lease origin auto/track-gnome51-junction

          EXISTING=$(gh pr list --head auto/track-gnome51-junction --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            PR_NUMBER="$EXISTING"
            echo "Existing PR #${PR_NUMBER} — re-enabling auto-merge"
          else
            PR_BODY=$(printf '%s\n\n%s' \
            "Bumps \`gnome-build-meta.bst\` (master) and \`freedesktop-sdk.bst\` atomically on the \`gnome-51\` branch. Auto-merges once \`bst show\` validation passes." \
            "> **Note:** When gnome-build-meta cuts a \`gnome-51\` branch, change \`track: master\` to \`track: gnome-51\` in \`elements/gnome-build-meta.bst\` on this branch.")
          PR_NUMBER=$(gh pr create \
            --base gnome-51 \
            --head auto/track-gnome51-junction \
            --title "chore(deps): update core junctions (gnome-51 branch)" \
            --body "$PR_BODY" \
            --json number --jq '.number')
            echo "Created PR #${PR_NUMBER}"
          fi

          # Enable auto-merge — merges automatically once required checks pass.
          gh pr merge "$PR_NUMBER" --auto --squash
