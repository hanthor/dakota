name: Generate BuildStream CI config
description: Write BuildStream CI config for the runner-based Dakota workflow.

inputs:
  enable-remote-execution:
    description: Retained for compatibility; Dakota uses the GitHub runner for builds and cache.projectbluefin.io for artifact/source caches.
    required: true
  enable-push:
    description: Push artifacts and sources to the remote cache. Set false for build jobs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Generate BuildStream CI config
      shell: bash
      env:
        ENABLE_REMOTE_EXECUTION: ${{ inputs.enable-remote-execution }}
        ENABLE_PUSH: ${{ inputs.enable-push }}
      run: |
        set -euo pipefail
        mkdir -p /src/logs logs

        if [[ "${ENABLE_REMOTE_EXECUTION:-false}" == "true" ]]; then
          echo "::error::Dakota CI uses the GitHub runner for the BuildStream build; remote execution is intentionally disabled."
          exit 1
        fi

        echo "${CASD_CLIENT_CERT:-}" > /src/client.crt
        echo "${CASD_CLIENT_KEY:-}" > /src/client.key

        cat > /src/buildstream-ci.conf <<'BSTCONF'
        scheduler:
          on-error: continue
          fetchers: 32
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs
        BSTCONF

        cat >> /src/buildstream-ci.conf <<'BSTCONFBUILD'
        build:
          retry-failed: True
        BSTCONFBUILD

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          PUSH_FLAG="true"
          [[ "${ENABLE_PUSH:-true}" == "false" ]] && PUSH_FLAG="false"
          cat >> /src/buildstream-ci.conf <<BSTCONFCACHE
        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        source-caches:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: ${PUSH_FLAG}
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
        BSTCONFCACHE
        fi

        cat >> /src/buildstream-ci.conf <<'BSTCONFCACHEBLOCK'

        cache:
          cache-buildtrees: never
        BSTCONFCACHEBLOCK

        cp /src/buildstream-ci.conf logs/buildstream-ci.conf
        echo "Remote execution enabled: no"
        echo "=== BuildStream CI config ==="
        cat /src/buildstream-ci.conf

        if [[ -n "${CASD_CLIENT_CERT:-}" ]] && [[ -n "${CASD_CLIENT_KEY:-}" ]]; then
          cat > /src/buildstream-push.conf <<'BSTCONFPUSH'
        scheduler:
          on-error: continue
          fetchers: 16
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs

        build:
          retry-failed: True

        cache:
          cache-buildtrees: never

        artifacts:
          servers:
          - url: https://cache.projectbluefin.io:11002
            push: true
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
            auth:
              client-key: /src/client.key
              client-cert: /src/client.crt
          - url: https://gbm.gnome.org:11003
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180
          - url: https://cache.freedesktop-sdk.io:11001
            push: false
            connection-config:
              keepalive-time: 180
              retry-limit: 5
              retry-delay: 1000
              request-timeout: 180

        BSTCONFPUSH
          cp /src/buildstream-push.conf logs/buildstream-push.conf
          echo "=== BuildStream push config ==="
          cat /src/buildstream-push.conf
        fi
